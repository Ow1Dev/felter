openapi: 3.0.3
info:
  title: Field Service API
  version: 1.0.0
servers:
  - url: /
paths:
  /schemas:
    get:
      operationId: listSchemas
      summary: List schemas for a project
      parameters:
        - name: project_slug
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of schemas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schema'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createSchema
      summary: Create a new schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchemaRequest'
      responses:
        '201':
          description: Schema created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Schema already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /schemas/{schemaKey}:
    get:
      operationId: getSchema
      summary: Get a schema with its fields
      parameters:
        - name: schemaKey
          in: path
          required: true
          schema:
            type: string
        - name: project_slug
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schema found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaWithFields'
        '404':
          description: Schema not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteSchema
      summary: Delete a schema
      parameters:
        - name: schemaKey
          in: path
          required: true
          schema:
            type: string
        - name: project_slug
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Schema deleted
        '404':
          description: Schema not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /schemas/{schemaKey}/fields:
    post:
      operationId: createSchemaField
      summary: Add a field to a schema
      parameters:
        - name: schemaKey
          in: path
          required: true
          schema:
            type: string
        - name: project_slug
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchemaFieldRequest'
      responses:
        '201':
          description: Field created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaField'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Schema not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Field already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /schemas/{schemaKey}/fields/{fieldKey}:
    delete:
      operationId: deleteSchemaField
      summary: Remove a field from a schema
      parameters:
        - name: schemaKey
          in: path
          required: true
          schema:
            type: string
        - name: fieldKey
          in: path
          required: true
          schema:
            type: string
        - name: project_slug
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Field deleted
        '404':
          description: Schema or field not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Schema:
      type: object
      required:
        - project_slug
        - key
        - name
        - created_by
        - created_at
        - updated_at
      properties:
        project_slug:
          type: string
        key:
          type: string
        name:
          type: string
        created_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SchemaWithFields:
      allOf:
        - $ref: '#/components/schemas/Schema'
        - type: object
          properties:
            fields:
              type: array
              items:
                $ref: '#/components/schemas/SchemaField'
    SchemaField:
      type: object
      required:
        - key
        - type
        - created_by
        - created_at
        - updated_at
      properties:
        key:
          type: string
        type:
          $ref: '#/components/schemas/FieldType'
        created_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FieldType:
      type: string
      enum:
        - string
        - int
        - float
        - boolean
        - date
        - datetime
    CreateSchemaRequest:
      type: object
      required:
        - project_slug
        - key
        - name
      properties:
        project_slug:
          type: string
        key:
          type: string
        name:
          type: string
    CreateSchemaFieldRequest:
      type: object
      required:
        - key
        - type
      properties:
        key:
          type: string
        type:
          $ref: '#/components/schemas/FieldType'
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
